<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POELGOVNA — Игровой дашборд</title>
  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===== ОСНОВНЫЕ СТИЛИ (POELGOVNA THEME) ===== */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      padding: 20px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== ФОНОВЫЕ ЭФФЕКТЫ ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(155, 89, 182, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(155, 89, 182, 0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(200, 150, 255, 0.04) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    /* ===== ЗАСТАВКА ===== */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }
    #splashScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splashScreen .logo {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 5rem;
      background: linear-gradient(135deg, #8e44ad, #9b59b6, #bb8fce);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 60px rgba(155, 89, 182, 0.3);
      animation: pulseGlow 2s ease-in-out infinite;
    }
    #splashScreen .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-weight: 400;
      font-size: 1.2rem;
      color: #666;
      letter-spacing: 6px;
      margin-top: 10px;
      -webkit-text-fill-color: #666;
    }
    #splashScreen .click-hint {
      margin-top: 40px;
      font-size: 0.9rem;
      color: #444;
      letter-spacing: 3px;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { text-shadow: 0 0 40px rgba(155, 89, 182, 0.2); }
      50% { text-shadow: 0 0 80px rgba(155, 89, 182, 0.5); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
    .container-fluid {
      position: relative;
      z-index: 1;
    }

    /* ===== ЗАГОЛОВОК ===== */
    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid rgba(155, 89, 182, 0.15);
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .main-header .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .main-header .brand .logo-text {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 2rem;
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .main-header .brand .year {
      font-family: 'Orbitron', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      color: #666;
      -webkit-text-fill-color: #666;
    }
    .main-header .brand .badge-nassal {
      background: rgba(155, 89, 182, 0.15);
      border: 1px solid rgba(155, 89, 182, 0.3);
      color: #bb8fce;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* ===== ВКЛАДКИ ===== */
    .nav-tabs {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 4px;
    }
    .nav-tabs .nav-link {
      color: #888;
      border: none;
      background: transparent;
      padding: 10px 22px;
      border-radius: 8px 8px 0 0;
      font-weight: 500;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      transition: all 0.3s;
      position: relative;
      font-family: 'Inter', sans-serif;
    }
    .nav-tabs .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.04);
    }
    .nav-tabs .nav-link.active {
      color: #bb8fce;
      background: rgba(155, 89, 182, 0.08);
      border-bottom: 2px solid #9b59b6;
    }
    .nav-tabs .nav-link i {
      margin-right: 8px;
    }

    /* ===== КАРТОЧКИ ===== */
    .card {
      background: rgba(20, 20, 30, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }
    .card:hover {
      border-color: rgba(155, 89, 182, 0.15);
    }
    .card-header {
      background: transparent;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-weight: 600;
      font-size: 1rem;
      padding: 16px 22px;
      color: #ccc;
      font-family: 'Inter', sans-serif;
    }
    .card-header i {
      color: #9b59b6;
      margin-right: 10px;
    }
    .card-body {
      padding: 20px 22px;
    }

    /* ===== СТАТИСТИКА ===== */
    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 15px 18px;
      text-align: center;
      height: 100%;
      transition: border-color 0.3s;
    }
    .stat-box:hover {
      border-color: rgba(155, 89, 182, 0.2);
    }
    .stat-box .number {
      font-size: 2.2rem;
      font-weight: 700;
      color: #bb8fce;
      font-family: 'Orbitron', sans-serif;
    }
    .stat-box .label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* ===== ТАБЛИЦЫ ===== */
    .table-wrap {
      overflow-x: auto;
    }
    .table-wrap table,
    .table-wrap table td,
    .table-wrap table th {
      color: #ddd !important;
      border-color: rgba(255, 255, 255, 0.04) !important;
    }
    .table-wrap table th {
      background: rgba(255, 255, 255, 0.02);
      color: #bb8fce !important;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(155, 89, 182, 0.15) !important;
    }
    .table-wrap table th:hover {
      background: rgba(155, 89, 182, 0.06);
    }
    .table-wrap table td {
      font-size: 0.85rem;
      padding: 10px 12px;
      vertical-align: middle;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03) !important;
    }
    .table-wrap table tr:hover td {
      background: rgba(155, 89, 182, 0.03);
    }

    /* ===== ПОЛЯ ПОИСКА ===== */
    .search-filter-row input,
    .search-filter-row select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #fff !important;
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.85rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .search-filter-row input::placeholder {
      color: #666;
    }
    .search-filter-row input:focus,
    .search-filter-row select:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: #9b59b6;
      box-shadow: 0 0 20px rgba(155, 89, 182, 0.08);
      outline: none;
    }

    .table-count-label {
      color: #888 !important;
      font-size: 0.8rem;
    }

    /* ===== БЭЙДЖИ ===== */
    .badge-card {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
      font-size: 0.65rem;
      padding: 3px 12px;
      border-radius: 20px;
      margin: 2px;
      display: inline-block;
    }
    .badge-card.active {
      background: rgba(155, 89, 182, 0.15);
      color: #bb8fce;
    }
    .badge-card.passive {
      background: rgba(100, 100, 200, 0.12);
      color: #99aaff;
    }

    /* ===== АВАТАРЫ (NASSAL стиль) ===== */
    .player-avatar-wrapper {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .player-avatar-photo {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      border: 3px solid rgba(155, 89, 182, 0.3);
      box-shadow: 0 0 30px rgba(155, 89, 182, 0.1);
      flex-shrink: 0;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(20, 20, 30, 0.8);
    }
    .player-avatar-photo:hover {
      transform: scale(1.03);
      border-color: #9b59b6;
      box-shadow: 0 0 50px rgba(155, 89, 182, 0.2);
    }
    .player-avatar-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .player-name-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: #fff;
      letter-spacing: 1px;
    }

    /* ===== ГРАФИКИ ===== */
    .chart-container {
      position: relative;
      height: 250px;
      margin: 10px 0;
      overflow-x: auto;
      overflow-y: hidden;
      width: 100%;
      -webkit-overflow-scrolling: touch;
    }
    .chart-container canvas {
      height: 250px !important;
      min-width: 100%;
    }

    .chart-container::-webkit-scrollbar {
      height: 6px;
    }
    .chart-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 4px;
    }
    .chart-container::-webkit-scrollbar-thumb {
      background: #9b59b6;
      border-radius: 4px;
    }
    .chart-container::-webkit-scrollbar-thumb:hover {
      background: #bb8fce;
    }
    .chart-container {
      scrollbar-width: thin;
      scrollbar-color: #9b59b6 rgba(255, 255, 255, 0.04);
    }

    /* ===== КОЛЁСА ===== */
    .wheel-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .wheel-list li {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #aaa;
      transition: all 0.3s;
    }
    .wheel-list li:hover {
      border-color: rgba(155, 89, 182, 0.2);
      color: #fff;
    }

    /* ===== МОДАЛКА ===== */
    .modal-content {
      background: rgba(16, 16, 24, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      color: #ddd;
    }
    .modal-header {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .modal-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 600;
      color: #bb8fce;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #aaa;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .btn-close-white {
      filter: brightness(0.5) invert(1);
      opacity: 0.5;
    }
    .btn-close-white:hover {
      opacity: 1;
    }

    /* ===== АРТ ГАЛЕРЕЯ ===== */
    .art-placeholder {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      color: #555;
      font-size: 0.9rem;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 768px) {
      .main-header .brand .logo-text { font-size: 1.4rem; }
      .main-header .brand .badge-nassal { font-size: 0.6rem; padding: 3px 10px; }
      .nav-tabs .nav-link { padding: 8px 14px; font-size: 0.75rem; }
      .player-avatar-photo { width: 80px; height: 80px; }
      .player-name-title { font-size: 1.3rem; }
      #splashScreen .logo { font-size: 3rem; }
      .stat-box .number { font-size: 1.6rem; }
    }
    @media (max-width: 576px) {
      body { padding: 12px; }
      .nav-tabs .nav-link { padding: 6px 10px; font-size: 0.7rem; }
      .player-avatar-photo { width: 60px; height: 60px; }
      .player-name-title { font-size: 1.1rem; }
      .card-body { padding: 14px; }
    }
  </style>
</head>
<body>

<!-- ===== ЗАСТАВКА ===== -->
<div id="splashScreen" onclick="hideSplash()">
  <div class="logo">POELGOVNA</div>
  <div class="subtitle">2026</div>
  <div class="click-hint">▼ НАЖМИТЕ ЧТОБЫ НАЧАТЬ ▼</div>
</div>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<div class="container-fluid" id="mainContent" style="display:none;">

  <!-- ===== ШАПКА ===== -->
  <div class="main-header">
    <div class="brand">
      <span class="logo-text">POELGOVNA</span>
      <span class="year">2026</span>
      <span class="badge-nassal">🔥 Игровой дашборд</span>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="color:#666; font-size:0.75rem; letter-spacing:1px;">
        <i class="bi bi-controller"></i> #POELGOVNA2026
      </span>
    </div>
  </div>

  <!-- ===== ВКЛАДКИ ===== -->
  <ul class="nav nav-tabs" id="mainTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-Никита" type="button" role="tab"><i class="bi bi-person"></i>Никита</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-Вадим" type="button" role="tab"><i class="bi bi-person"></i>Вадим</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-Катя" type="button" role="tab"><i class="bi bi-person"></i>Катя</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-общая" type="button" role="tab"><i class="bi bi-bar-chart"></i>Статистика</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-карточки" type="button" role="tab"><i class="bi bi-collection"></i>Карточки</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-колесо" type="button" role="tab"><i class="bi bi-arrow-repeat"></i>Колесо</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-арт" type="button" role="tab"><i class="bi bi-images"></i>Арт</button>
    </li>
  </ul>

  <div class="tab-content mt-3">
    <!-- Вкладки игроков -->
    <div class="tab-pane fade show active" id="tab-Никита" role="tabpanel">
      <div id="content-Никита"></div>
    </div>
    <div class="tab-pane fade" id="tab-Вадим" role="tabpanel">
      <div id="content-Вадим"></div>
    </div>
    <div class="tab-pane fade" id="tab-Катя" role="tabpanel">
      <div id="content-Катя"></div>
    </div>
    <div class="tab-pane fade" id="tab-общая" role="tabpanel">
      <div id="content-общая"></div>
    </div>
    <div class="tab-pane fade" id="tab-карточки" role="tabpanel">
      <div id="content-карточки"></div>
    </div>
    <div class="tab-pane fade" id="tab-колесо" role="tabpanel">
      <div id="content-колесо"></div>
    </div>
    <div class="tab-pane fade" id="tab-арт" role="tabpanel">
      <div id="content-арт"></div>
    </div>
  </div>

</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ АВАТАРА ===== -->
<div class="modal fade" id="avatarModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="background:transparent; border:none; box-shadow:none;">
      <div class="modal-body p-0">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close" style="z-index:10;"></button>
        <div class="avatar-modal-content" id="avatarModalContent" style="display:flex; justify-content:center; align-items:center; min-height:300px; max-width:100%; max-height:90vh;">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ИГРЫ ===== -->
<div class="modal fade" id="gameDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalGameTitle">Название игры</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalGameBody">...</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  // ============================================================
  //  ЛОГИКА ДАШБОРДА
  // ============================================================
  let currentData = null;
  let chartInstances = {};
  let currentCardPlayer = 'Никита';

  function loadData(dataObj) {
    currentData = dataObj;

    for (const playerName in currentData.players) {
      const player = currentData.players[playerName];
      const earned = player.earnedCards || [];
      player.games.forEach(game => {
        game.cards = [];
        earned.forEach(ec => {
          if (ec.appliedToGame && ec.appliedToGame.toLowerCase() === game.name.toLowerCase()) {
            game.cards.push(ec.cardName);
          }
        });
      });
    }

    renderPlayerTab('Никита');
    renderPlayerTab('Вадим');
    renderPlayerTab('Катя');
    renderGeneralStats();
    renderCardsTab(currentCardPlayer);
    renderWheelGames();
    renderArtGallery();
  }

  function getGames(playerName) {
    if (!currentData) return [];
    const p = currentData.players[playerName];
    return p ? p.games : [];
  }

  function getEarnedCards(playerName) {
    if (!currentData) return [];
    const p = currentData.players[playerName];
    return p ? p.earnedCards || [] : [];
  }

  function getAllCardsDescriptions() {
    return currentData ? currentData.cards || [] : [];
  }

  function calcStats(playerName) {
    const games = getGames(playerName);
    let totalTime = 0, totalPoints = 0, totalRating = 0, ratingCount = 0;
    games.forEach(g => {
      if (g.time !== null && g.time !== undefined && !isNaN(parseFloat(g.time))) totalTime += parseFloat(g.time);
      if (g.points !== null && g.points !== undefined && !isNaN(parseFloat(g.points))) totalPoints += parseFloat(g.points);
      let numRating = parseFloat(g.rating);
      if (!isNaN(numRating)) {
        totalRating += numRating;
        ratingCount++;
      }
    });
    return {
      count: games.length,
      totalTime: totalTime,
      totalPoints: totalPoints,
      avgRating: ratingCount > 0 ? (totalRating / ratingCount) : 0
    };
  }

        <input type="text" id="searchInput-${playerName}" placeholder="Поиск по названию..." class="form-control form-control-sm" style="width:200px;">
        <select id="filterDifficulty-${playerName}" class="form-select form-select-sm" style="width:150px;">
          <option value="">Все сложности</option>
        </select>
        <span class="table-count-label ms-2">Пройдено: ${games.length}</span>
      </div>
      <div class="table-wrap">
        <table class="table table-hover" id="table-${playerName}">
          <thead>
            <tr>
              <th data-sort="name">Название</th>
              <th data-sort="difficulty">Сложность</th>
              <th data-sort="time">Время (ч)</th>
              <th data-sort="rating">Оценка</th>
              <th data-sort="hltb">HLTB</th>
              <th data-sort="metacritic">Metacritic</th>
              <th data-sort="points">Баллы</th>
            </tr>
          </thead>
          <tbody id="tbody-${playerName}"></tbody>
        </table>
      </div>
    `;

    container.innerHTML = html;
    renderTable(playerName, games);

    const diffSelect = document.getElementById(`filterDifficulty-${playerName}`);
    const uniqueDiffs = [...new Set(games.map(g => g.difficulty).filter(d => d && d.trim() !== ''))];
    uniqueDiffs.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      diffSelect.appendChild(opt);
    });

    document.getElementById(`searchInput-${playerName}`).addEventListener('input', () => filterTable(playerName));
    diffSelect.addEventListener('change', () => filterTable(playerName));

    document.querySelectorAll(`#table-${playerName} th[data-sort]`).forEach(th => {
      th.addEventListener('click', function() {
        sortTable(playerName, this.dataset.sort);
      });
    });

    drawChart(playerName);
  }

  let currentSort = { player: null, key: null, asc: true };

  function renderTable(playerName, gamesArray) {
    const tbody = document.getElementById(`tbody-${playerName}`);
    if (!tbody) return;
    let html = '';
    gamesArray.forEach((g, idx) => {
      const metacriticDisplay = formatDateOrNumber(g.metacritic);
      html += `<tr data-index="${idx}" style="cursor:pointer;" onclick="showGameDetail('${playerName}', ${idx})">
        <td>${g.name}</td>
        <td>${g.difficulty || '—'}</td>
        <td>${g.time !== null && g.time !== undefined ? g.time : '—'}</td>
        <td>${g.rating || '—'}</td>
        <td>${g.hltb || '—'}</td>
        <td>${metacriticDisplay}</td>
        <td>${g.points !== null && g.points !== undefined ? g.points : '—'}</td>
      </tr>`;
    });
    tbody.innerHTML = html;
  }

  function filterTable(playerName) {
    const games = getGames(playerName);
    const searchVal = document.getElementById(`searchInput-${playerName}`).value.toLowerCase();
    const diffVal = document.getElementById(`filterDifficulty-${playerName}`).value;
    const filtered = games.filter(g => {
      const matchName = g.name.toLowerCase().includes(searchVal);
      const matchDiff = diffVal === '' || g.difficulty === diffVal;
      return matchName && matchDiff;
    });
    if (currentSort.player === playerName && currentSort.key) {
      sortGames(filtered, currentSort.key, currentSort.asc);
    }
    renderTable(playerName, filtered);
  }

  function sortTable(playerName, key) {
    const games = getGames(playerName);
    if (currentSort.player === playerName && currentSort.key === key) {
      currentSort.asc = !currentSort.asc;
    } else {
      currentSort.player = playerName;
      currentSort.key = key;
      currentSort.asc = true;
    }
    const searchVal = document.getElementById(`searchInput-${playerName}`).value.toLowerCase();
    const diffVal = document.getElementById(`filterDifficulty-${playerName}`).value;
    const filtered = games.filter(g => {
      const matchName = g.name.toLowerCase().includes(searchVal);
      const matchDiff = diffVal === '' || g.difficulty === diffVal;
      return matchName && matchDiff;
    });
    sortGames(filtered, key, currentSort.asc);
    renderTable(playerName, filtered);
  }

  function sortGames(arr, key, asc) {
    arr.sort((a, b) => {
      let valA = a[key];
      let valB = b[key];
      if (['time', 'points'].includes(key)) {
        valA = parseFloat(valA) || 0;
        valB = parseFloat(valB) || 0;
        return asc ? valA - valB : valB - valA;
      }
      valA = (valA || '').toString().toLowerCase();
      valB = (valB || '').toString().toLowerCase();
      if (valA < valB) return asc ? -1 : 1;
      if (valA > valB) return asc ? 1 : -1;
      return 0;
    });
  }

  // ============================================================
  //  ГРАФИКИ
  // ============================================================
  function drawChart(playerName) {
    const canvas = document.getElementById(`chart-${playerName}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const games = getGames(playerName);
    if (!games || games.length === 0) return;

    const labels = games.map(g => g.name.length > 15 ? g.name.slice(0, 12)+'…' : g.name);
    const dataPoints = games.map(g => {
      let val = parseFloat(g.rating);
      return isNaN(val) ? 0 : val;
    });

    if (chartInstances[playerName]) {
      chartInstances[playerName].destroy();
    }

    const container = canvas.parentElement;
    const containerWidth = container.clientWidth || 400;
    const minWidth = Math.max(containerWidth, games.length * 45);
    canvas.style.width = minWidth + 'px';
    canvas.style.height = '250px';

    chartInstances[playerName] = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Оценка',
          data: dataPoints,
          backgroundColor: 'rgba(155, 89, 182, 0.7)',
          borderColor: '#9b59b6',
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: false,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { color: '#666' },
            grid: { color: 'rgba(255,255,255,0.04)' }
          },
          x: {
            ticks: { color: '#666', maxRotation: 45 }
          }
        }
      }
    });
  }

  // ============================================================
  //  ОТКРЫТИЕ АВАТАРА
  // ============================================================

  // ============================================================
  //  МОДАЛКА ИГРЫ
  // ============================================================
  function showGameDetail(playerName, index) {
    const games = getGames(playerName);
    const game = games[index];
    if (!game) return;
    document.getElementById('modalGameTitle').textContent = game.name;
    let body = `
      <p><strong>Сложность:</strong> ${game.difficulty || '—'}</p>
      <p><strong>Время (ч):</strong> ${game.time !== null && game.time !== undefined ? game.time : '—'}</p>
      <p><strong>Оценка:</strong> ${game.rating || '—'}</p>
      <p><strong>HLTB:</strong> ${game.hltb || '—'}</p>
      <p><strong>Metacritic:</strong> ${formatDateOrNumber(game.metacritic)}</p>
      <p><strong>Баллы:</strong> ${game.points !== null && game.points !== undefined ? game.points : '—'}</p>
      <p><strong>Комментарий:</strong> ${game.comment || '—'}</p>
      <p><strong>Применённые карточки:</strong> ${game.cards && game.cards.length ? game.cards.join(', ') : 'нет'}</p>
    `;
    document.getElementById('modalGameBody').innerHTML = body;
    const modal = new bootstrap.Modal(document.getElementById('gameDetailModal'));
    modal.show();
  }

  // ============================================================
  //  ОБЩАЯ СТАТИСТИКА
  // ============================================================
  function renderGeneralStats() {
    const container = document.getElementById('content-общая');
    if (!container) return;
    if (!currentData) {
      container.innerHTML = '<p class="text-muted">Нет данных.</p>';
      return;
    }
    const players = Object.keys(currentData.players);
    let html = `
      <div class="table-wrap">
        <table class="table table-bordered">
          <thead><tr><th>Игрок</th><th>Игр</th><th>Часов</th><th>Баллов</th><th>Средняя оценка</th></tr></thead>
          <tbody>
    `;
    players.forEach(name => {
      const stats = calcStats(name);
      html += `<tr><td>${name}</td><td>${stats.count}</td><td>${stats.totalTime.toFixed(1)}</td><td>${stats.totalPoints}</td><td>${stats.avgRating.toFixed(1)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    html += `<div class="chart-container"><canvas id="chart-comparison"></canvas></div>`;
    container.innerHTML = html;

    const ctx = document.getElementById('chart-comparison').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: players,
        datasets: [{
          label: 'Сумма баллов',
          data: players.map(name => calcStats(name).totalPoints),
          backgroundColor: 'rgba(155, 89, 182, 0.7)',
          borderColor: '#9b59b6',
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#888' } }
        },
        scales: {
          y: { beginAtZero: true, ticks: { color: '#666' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          x: { ticks: { color: '#666' } }
        }
      }
    });
  }

  // ============================================================
  //  КАРТОЧКИ
  // ============================================================
  function renderCardsTab(playerName) {
    const container = document.getElementById('content-карточки');
    if (!container) return;
    if (!currentData) {
      container.innerHTML = '<p class="text-muted">Нет данных.</p>';
      return;
    }

    const earned = getEarnedCards(playerName);
    const allCards = getAllCardsDescriptions();
    const cardMap = {};
    allCards.forEach(c => { cardMap[c.name] = c; });

    let html = `
      <div class="card mb-4">
        <div class="card-header"><i class="bi bi-person-badge"></i> Мои карточки</div>
        <div class="card-body">
          <div class="player-selector">
            <label class="me-2" style="color:#888;">Выберите игрока:</label>
            <select id="cardPlayerSelect" class="form-select form-select-sm" style="display:inline-block; width:auto; background:rgba(255,255,255,0.04); color:#fff; border:1px solid rgba(255,255,255,0.06); border-radius:10px;">
    `;
    const playerNames = Object.keys(currentData.players);
    playerNames.forEach(name => {
      html += `<option value="${name}" ${name === playerName ? 'selected' : ''}>${name}</option>`;
    });
    html += `</select></div>`;

    if (earned.length === 0) {
      html += '<p class="text-muted mt-3">У этого игрока нет заработанных карточек.</p>';
    } else {
      html += `<div class="table-wrap mt-3"><table class="table table-bordered">
        <thead><tr><th>Название</th><th>Тип</th><th>Описание</th><th>Применена к игре</th></tr></thead><tbody>`;
      earned.forEach(ec => {
        const cardInfo = cardMap[ec.cardName] || { type: '—', description: 'Описание отсутствует' };
        const appliedGame = ec.appliedToGame || 'Не применена';
        html += `<tr>
          <td>${ec.cardName}</td>
          <td><span class="badge-card ${cardInfo.type === 'Актив' ? 'active' : 'passive'}">${cardInfo.type}</span></td>
          <td>${cardInfo.description}</td>
          <td>${appliedGame}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }
    html += `</div></div>`;

    html += `
      <div class="card">
        <div class="card-header"><i class="bi bi-collection"></i> Все карточки (описания)</div>
        <div class="card-body">
          <div class="table-wrap"><table class="table table-bordered">
            <thead><tr><th>Название</th><th>Тип</th><th>Описание</th></tr></thead><tbody>`;
    allCards.forEach(c => {
      html += `<tr>
        <td>${c.name}</td>
        <td><span class="badge-card ${c.type === 'Актив' ? 'active' : 'passive'}">${c.type}</span></td>
        <td>${c.description}</td>
      </tr>`;
    });
    html += `</tbody></table></div>
        </div>
      </div>
    `;

    container.innerHTML = html;

    document.getElementById('cardPlayerSelect').addEventListener('change', function() {
      currentCardPlayer = this.value;
      renderCardsTab(currentCardPlayer);
    });
  }

  // ============================================================
  //  КОЛЕСО
  // ============================================================
  function renderWheelGames() {
    const container = document.getElementById('content-колесо');
    if (!container) return;
    if (!currentData) {
      container.innerHTML = '<p class="text-muted">Нет данных.</p>';
      return;
    }
    const wheel = currentData.wheelGames;
    let html = '<div class="card"><div class="card-body">';
    for (const player in wheel) {
      const games = wheel[player] || [];
      html += `<div class="mb-3"><strong style="color:#bb8fce; font-family:'Orbitron',sans-serif; letter-spacing:1px;">${player}</strong> <ul class="wheel-list">`;
      games.forEach(g => { html += `<li>${g}</li>`; });
      html += `</ul></div>`;
    }
    html += '</div></div>';
    container.innerHTML = html;
  }

  // ============================================================
  //  АРТ ГАЛЕРЕЯ
  // ============================================================
  function renderArtGallery() {
    const container = document.getElementById('content-арт');
    if (!container) return;
    if (!currentData) {
      container.innerHTML = '<p class="text-muted">Нет данных.</p>';
      return;

    players.forEach(player => {
      html += `
        <div class="card mb-3">
          <div class="card-header"><i class="bi bi-image"></i> ${player}</div>

            </div>
            <div class="row mt-3" id="art-${player}">
              <!-- сюда можно будет вставлять изображения -->

        </div>
      `;
    });
    container.innerHTML = html;
  }

  // ============================================================
  //  ВСПОМОГАТЕЛЬНЫЕ
  // ============================================================
  function formatDateOrNumber(val) {
    if (!val) return '—';
    if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val)) {
      const d = new Date(val);
      if (!isNaN(d)) return d.toLocaleDateString('ru-RU');
    }
    return val;
  }

  // ============================================================
  //  ИНИЦИАЛИЗАЦИЯ
  // ============================================================
  window.addEventListener('DOMContentLoaded', function() {
    loadData(sampleData);
  });
</script>
