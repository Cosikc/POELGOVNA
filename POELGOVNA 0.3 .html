<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POELGOVNA — Игровой дашборд</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===== ВСЕ СТИЛИ ===== */
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0f; color:#e0e0e0; font-family:'Inter',sans-serif; padding:20px; min-height:100vh; overflow-x:hidden; }
    body::before { content:''; position:fixed; top:0;left:0;right:0;bottom:0; background:radial-gradient(ellipse at 20% 50%, rgba(155,89,182,0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 50%, rgba(155,89,182,0.05) 0%, transparent 60%), radial-gradient(ellipse at 50% 100%, rgba(200,150,255,0.04) 0%, transparent 40%); pointer-events:none; z-index:0; }
    #splashScreen { position:fixed; top:0;left:0;right:0;bottom:0; background:#0a0a0f; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; cursor:pointer; transition: opacity 1.2s, visibility 1.2s; }
    #splashScreen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    #splashScreen .logo { font-family:'Orbitron',sans-serif; font-weight:900; font-size:5rem; background:linear-gradient(135deg,#8e44ad,#9b59b6,#bb8fce); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 60px rgba(155,89,182,0.3); animation:pulseGlow 2s ease-in-out infinite; }
    #splashScreen .subtitle { font-family:'Orbitron',sans-serif; font-weight:400; font-size:1.2rem; color:#666; letter-spacing:6px; margin-top:10px; -webkit-text-fill-color:#666; }
    #splashScreen .click-hint { margin-top:40px; font-size:0.9rem; color:#444; letter-spacing:3px; animation:blink 1.5s infinite; }
    @keyframes pulseGlow { 0%,100% { text-shadow:0 0 40px rgba(155,89,182,0.2); } 50% { text-shadow:0 0 80px rgba(155,89,182,0.5); } }
    @keyframes blink { 0%,100% { opacity:0.3; } 50% { opacity:1; } }
    .container-fluid { position:relative; z-index:1; }
    .main-header { display:flex; align-items:center; justify-content:space-between; padding:15px 0; border-bottom:1px solid rgba(155,89,182,0.15); margin-bottom:25px; flex-wrap:wrap; gap:15px; }
    .main-header .brand { display:flex; align-items:center; gap:15px; }
    .main-header .brand .logo-text { font-family:'Orbitron',sans-serif; font-weight:900; font-size:2rem; background:linear-gradient(135deg,#8e44ad,#9b59b6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .main-header .brand .year { font-family:'Orbitron',sans-serif; font-weight:400; font-size:1rem; color:#666; -webkit-text-fill-color:#666; }
    .main-header .brand .badge-nassal { background:rgba(155,89,182,0.15); border:1px solid rgba(155,89,182,0.3); color:#bb8fce; padding:4px 14px; border-radius:20px; font-size:0.7rem; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
    .nav-tabs { border-bottom:1px solid rgba(255,255,255,0.06); gap:4px; }
    .nav-tabs .nav-link { color:#888; border:none; background:transparent; padding:10px 22px; border-radius:8px 8px 0 0; font-weight:500; font-size:0.85rem; letter-spacing:0.5px; transition:all 0.3s; font-family:'Inter',sans-serif; }
    .nav-tabs .nav-link:hover { color:#fff; background:rgba(255,255,255,0.04); }
    .nav-tabs .nav-link.active { color:#bb8fce; background:#0a0a0a; border-bottom:2px solid #9b59b6; }
    .nav-tabs .nav-link i { margin-right:8px; }
    .card { background:rgba(20,20,30,0.8); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.04); border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,0.4); margin-bottom:20px; transition:border-color 0.3s; }
    .card:hover { border-color:rgba(155,89,182,0.15); }
    .card-header { background:transparent; border-bottom:1px solid rgba(255,255,255,0.04); font-weight:600; font-size:1rem; padding:16px 22px; color:#ccc; font-family:'Inter',sans-serif; display:flex; justify-content:space-between; align-items:center; }
    .card-header i { color:#9b59b6; margin-right:10px; }
    .card-body { padding:20px 22px; }
    .stat-box { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04); border-radius:12px; padding:15px 18px; text-align:center; height:100%; transition:border-color 0.3s; }
    .stat-box:hover { border-color:rgba(155,89,182,0.2); }
    .stat-box .number { font-size:2.2rem; font-weight:700; color:#bb8fce; font-family:'Orbitron',sans-serif; }
    .stat-box .label { font-size:0.75rem; color:#888; text-transform:uppercase; letter-spacing:1.5px; margin-top:4px; }
    .table-wrap { overflow-x:auto; }
    .table-wrap table, .table-wrap table td, .table-wrap table th { color:#ddd !important; border-color:rgba(255,255,255,0.04) !important; }
    .table-wrap table th { background:rgba(255,255,255,0.02); color:#bb8fce !important; cursor:pointer; user-select:none; white-space:nowrap; font-weight:600; font-size:0.75rem; letter-spacing:0.5px; text-transform:uppercase; border-bottom:1px solid rgba(155,89,182,0.15) !important; }
    .table-wrap table th:hover { background:rgba(155,89,182,0.06); }
    .table-wrap table td { font-size:0.85rem; padding:10px 12px; vertical-align:middle; border-bottom:1px solid rgba(255,255,255,0.03) !important; }
    .table-wrap table tr:hover td { background:rgba(155,89,182,0.03); }
    .search-filter-row input, .search-filter-row select { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff !important; border-radius:10px; padding:8px 16px; font-size:0.85rem; transition:border-color 0.3s, box-shadow 0.3s, background 0.3s; }
    .search-filter-row input::placeholder { color:#666; }
    .search-filter-row input:focus, .search-filter-row select:focus { background:#0a0a0a; border-color:#9b59b6; box-shadow:0 0 20px rgba(155,89,182,0.08); outline:none; }
    .player-selector select { background:#0a0a0a !important; border:1px solid rgba(255,255,255,0.06); color:#fff !important; border-radius:10px; padding:8px 16px; }
    .player-selector select:focus { border-color:#9b59b6; outline:none; }
    .player-selector select option { background:#0a0a0a; color:#fff; }
    .table-count-label { color:#888 !important; font-size:0.8rem; }
    .badge-card { background:rgba(255,255,255,0.05); color:#aaa; font-size:0.65rem; padding:3px 12px; border-radius:20px; margin:2px; display:inline-block; }
    .badge-card.active { background:rgba(155,89,182,0.15); color:#bb8fce; }
    .badge-card.passive { background:rgba(100,100,200,0.12); color:#99aaff; }
    .player-avatar-wrapper { display:flex; align-items:center; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
    .player-avatar-photo { width:120px; height:120px; border-radius:12px; border:3px solid rgba(155,89,182,0.3); box-shadow:0 0 30px rgba(155,89,182,0.1); flex-shrink:0; overflow:hidden; cursor:pointer; transition:all 0.3s; background:rgba(20,20,30,0.8); position:relative; }
    .player-avatar-photo:hover { transform:scale(1.03); border-color:#9b59b6; box-shadow:0 0 50px rgba(155,89,182,0.2); }
    .player-avatar-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .player-name-title { font-family:'Orbitron',sans-serif; font-weight:700; font-size:1.8rem; color:#fff; letter-spacing:1px; }
    .avatar-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .chart-container { position:relative; height:250px; margin:10px 0; overflow-x:auto; overflow-y:hidden; width:100%; -webkit-overflow-scrolling:touch; }
    .chart-container canvas { height:250px !important; display:block; }
    .chart-container::-webkit-scrollbar { height:6px; }
    .chart-container::-webkit-scrollbar-track { background:rgba(255,255,255,0.04); border-radius:4px; }
    .chart-container::-webkit-scrollbar-thumb { background:#9b59b6; border-radius:4px; }
    .chart-container::-webkit-scrollbar-thumb:hover { background:#bb8fce; }
    .chart-container { scrollbar-width:thin; scrollbar-color:#9b59b6 rgba(255,255,255,0.04); }
    .wheel-list { list-style:none; padding:0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .wheel-list li { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.04); padding:4px 16px; border-radius:20px; font-size:0.8rem; color:#aaa; transition:all 0.3s; display:inline-flex; align-items:center; gap:6px; }
    .wheel-list li:hover { border-color:rgba(155,89,182,0.2); color:#fff; }
    .wheel-list li .remove-wheel { color:#e74c3c; cursor:pointer; font-size:0.7rem; opacity:0.5; transition:0.3s; }
    .wheel-list li .remove-wheel:hover { opacity:1; }
    .modal-content { background:rgba(16,16,24,0.95); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.06); border-radius:16px; color:#ddd; }
    .modal-header { border-bottom:1px solid rgba(255,255,255,0.06); }
    .modal-footer { border-top:1px solid rgba(255,255,255,0.06); }
    .modal-title { font-family:'Orbitron',sans-serif; font-weight:600; color:#bb8fce; }
    .btn-secondary { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.06); color:#aaa; }
    .btn-secondary:hover { background:rgba(255,255,255,0.1); color:#fff; }
    .btn-close-white { filter:brightness(0.5) invert(1); opacity:0.5; }
    .btn-close-white:hover { opacity:1; }
    .btn-edit-mode { background:#9b59b6; color:#fff; border:none; border-radius:20px; padding:6px 18px; font-size:0.8rem; transition:0.3s; }
    .btn-edit-mode.active { background:#bb8fce; }
    .btn-edit-mode:hover { background:#8e44ad; }
    .admin-btn { background:rgba(155,89,182,0.2); border:1px solid rgba(155,89,182,0.3); color:#bb8fce; border-radius:8px; padding:4px 12px; font-size:0.8rem; transition:0.3s; cursor:pointer; }
    .admin-btn:hover { background:rgba(155,89,182,0.4); }
    .admin-btn.danger { color:#e74c3c; border-color:rgba(231,76,60,0.3); }
    .admin-btn.danger:hover { background:rgba(231,76,60,0.2); }
    .art-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:15px; margin-top:15px; }
    .art-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:12px; overflow:hidden; transition:0.3s; position:relative; }
    .art-item:hover { border-color:#9b59b6; }
    .art-item img { width:100%; height:150px; object-fit:cover; display:block; }
    .art-item .art-name { padding:8px 10px; font-size:0.8rem; color:#aaa; text-align:center; background:rgba(0,0,0,0.3); }
    .art-item .art-delete { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.6); border:none; color:#fff; border-radius:50%; width:28px; height:28px; font-size:0.8rem; opacity:0; transition:0.3s; }
    .art-item:hover .art-delete { opacity:1; }
    .btn-reset { background:rgba(231,76,60,0.2); border:1px solid rgba(231,76,60,0.3); color:#e74c3c; border-radius:8px; padding:4px 12px; font-size:0.8rem; cursor:pointer; transition:0.3s; }
    .btn-reset:hover { background:rgba(231,76,60,0.4); }
    .wheel-add-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
    .wheel-add-row input { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; border-radius:10px; padding:6px 14px; flex:1; min-width:150px; }
    .wheel-add-row input:focus { outline:none; border-color:#9b59b6; }
    @media (max-width:768px) {
      .main-header .brand .logo-text { font-size:1.4rem; }
      .main-header .brand .badge-nassal { font-size:0.6rem; padding:3px 10px; }
      .nav-tabs .nav-link { padding:8px 14px; font-size:0.75rem; }
      .player-avatar-photo { width:80px; height:80px; }
      .player-name-title { font-size:1.3rem; }
      #splashScreen .logo { font-size:3rem; }
      .stat-box .number { font-size:1.6rem; }
      .art-grid { grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); }
    }
    @media (max-width:576px) {
      body { padding:12px; }
      .nav-tabs .nav-link { padding:6px 10px; font-size:0.7rem; }
      .player-avatar-photo { width:60px; height:60px; }
      .player-name-title { font-size:1.1rem; }
      .card-body { padding:14px; }
    }
  </style>
</head>
<body>

<!-- ===== ЗАСТАВКА ===== -->
<div id="splashScreen" onclick="hideSplash()">
  <div class="logo">POELGOVNA</div>
  <div class="subtitle">2026</div>
  <div class="click-hint">▼ НАЖМИТЕ ЧТОБЫ НАЧАТЬ ▼</div>
</div>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<div class="container-fluid" id="mainContent" style="display:none;">

  <!-- ===== ШАПКА ===== -->
  <div class="main-header">
    <div class="brand">
      <span class="logo-text">POELGOVNA</span>
      <span class="year">2026</span>
      <span class="badge-nassal">🔥 Игровой дашборд</span>
    </div>
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <button class="btn-edit-mode" id="editModeToggle">🔧 Режим редактирования</button>
      <button class="admin-btn" onclick="exportData()"><i class="bi bi-download"></i> JSON</button>
      <button class="admin-btn" onclick="document.getElementById('importInput').click()"><i class="bi bi-upload"></i> JSON</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn-reset" onclick="resetData()"><i class="bi bi-arrow-counterclockwise"></i> Сбросить данные</button>
      <span style="color:#666; font-size:0.75rem; letter-spacing:1px;"><i class="bi bi-controller"></i> #POELGOVNA2026</span>
    </div>
  </div>

  <!-- ===== ВКЛАДКИ ===== -->
  <ul class="nav nav-tabs" id="mainTabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-Никита" type="button" role="tab"><i class="bi bi-person"></i>Никита</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-Вадим" type="button" role="tab"><i class="bi bi-person"></i>Вадим</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-Катя" type="button" role="tab"><i class="bi bi-person"></i>Катя</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-общая" type="button" role="tab"><i class="bi bi-bar-chart"></i>Статистика</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-карточки" type="button" role="tab"><i class="bi bi-collection"></i>Карточки</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-колесо" type="button" role="tab"><i class="bi bi-arrow-repeat"></i>Колесо</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-арт" type="button" role="tab"><i class="bi bi-images"></i>Арт</button></li>
  </ul>

  <div class="tab-content mt-3">
    <div class="tab-pane fade show active" id="tab-Никита" role="tabpanel"><div id="content-Никита"></div></div>
    <div class="tab-pane fade" id="tab-Вадим" role="tabpanel"><div id="content-Вадим"></div></div>
    <div class="tab-pane fade" id="tab-Катя" role="tabpanel"><div id="content-Катя"></div></div>
    <div class="tab-pane fade" id="tab-общая" role="tabpanel"><div id="content-общая"></div></div>
    <div class="tab-pane fade" id="tab-карточки" role="tabpanel"><div id="content-карточки"></div></div>
    <div class="tab-pane fade" id="tab-колесо" role="tabpanel"><div id="content-колесо"></div></div>
    <div class="tab-pane fade" id="tab-арт" role="tabpanel"><div id="content-арт"></div></div>
  </div>

</div>

<!-- ===== МОДАЛЬНЫЕ ОКНА ===== -->
<div class="modal fade" id="gameModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="gameModalTitle">Игра</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="gameModalPlayer">
        <input type="hidden" id="gameModalIndex">
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gameName" placeholder="Название"></div>
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gameDifficulty" placeholder="Сложность"></div>
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gameTime" placeholder="Время (ч)"></div>
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gameRating" placeholder="Оценка"></div>
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gameHltb" placeholder="HLTB"></div>
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gameMetacritic" placeholder="Metacritic"></div>
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gamePoints" placeholder="Баллы"></div>
        <div class="mb-2"><input class="form-control form-control-sm bg-dark text-white border-secondary" id="gameComment" placeholder="Комментарий"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary" id="gameModalSave">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="addCardModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить карточку игроку</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="addCardPlayer">
        <div class="mb-2">
          <label class="form-label">Название карточки</label>
          <input class="form-control form-control-sm bg-dark text-white border-secondary" id="addCardName" placeholder="Введите название">
        </div>
        <div class="mb-2">
          <label class="form-label">Применить к игре (опционально)</label>
          <select class="form-select form-select-sm bg-dark text-white border-secondary" id="addCardGame">
            <option value="">Не применять</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary" id="addCardSave">Добавить</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="avatarModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="background:transparent; border:none; box-shadow:none;">
      <div class="modal-body p-0">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
        <div id="avatarModalContent" style="display:flex; justify-content:center; align-items:center; min-height:300px;"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="gameDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="modalGameTitle">Название игры</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="modalGameBody"></div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ============================================================
  //  УПРАВЛЕНИЕ ДАННЫМИ (localStorage)
  // ============================================================
  const STORAGE_KEY = 'poelgovna_data';
  let editMode = false;

  function getDefaultData() {
    return {
      players: {
        "Никита": {
          avatar: "https://sun9-63.vkuserphoto.ru/s/v1/ig2/n0upC2CCJJxJlSB0nGDKfyZL-nB7hZjUqSAQeCN-qW7QUNFOWnpWPYuBEQnYo3mL_ZT6MzhQD_iB-Gashj407luT.jpg?quality=95&as=32x48,48x72,72x108,108x162,160x240,240x360,360x540,480x720,540x810,640x960,720x1080,853x1280&from=bu&u=FgoR4yOnRV5ipu-Sczk0h0kza_djDyQARmL53WffBHo&cs=853x0",
          games: [

  function loadData() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed && parsed.players) return parsed;
      }
    } catch(e) { console.warn('Ошибка загрузки из localStorage:', e); }
    const def = getDefaultData();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(def)); } catch(e) {}
    return def;
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) { console.warn('Не удалось сохранить в localStorage:', e); }
  }

  function resetData() {
    if (!confirm('Сбросить все данные до исходных? Внесённые изменения будут потеряны.')) return;
    localStorage.removeItem(STORAGE_KEY);
    currentData = getDefaultData();
    saveData(currentData);
    renderAll();
  }

  // ============================================================
  //  ОСНОВНАЯ ЛОГИКА
  // ============================================================
  let currentData = null;
  let chartInstances = {};
  let currentCardPlayer = 'Никита';

  function init() {
    currentData = loadData();
    syncCards();
    renderAll();
  }

  function syncCards() {
    for (const p in currentData.players) {
      const player = currentData.players[p];
      const earned = player.earnedCards || [];
      player.games.forEach(game => {
        game.cards = [];
        earned.forEach(ec => {
          if (ec.appliedToGame && ec.appliedToGame.toLowerCase() === game.name.toLowerCase()) {
            game.cards.push(ec.cardName);
          }
        });
      });
    }
  }

  function renderAll() {
    renderPlayerTab('Никита');
    renderPlayerTab('Вадим');
    renderPlayerTab('Катя');
    renderGeneralStats();
    renderCardsTab(currentCardPlayer);
    renderWheelGames();
    renderArtGallery();
  }

  function getGames(playerName) {
    if (!currentData) return [];
    const p = currentData.players[playerName];
    return p ? p.games : [];
  }

  function getEarnedCards(playerName) {
    if (!currentData) return [];
    const p = currentData.players[playerName];
    return p ? p.earnedCards || [] : [];
  }

  function getAllCardsDescriptions() {
    return currentData ? currentData.cards || [] : [];
  }

  function calcStats(playerName) {
    const games = getGames(playerName);
    let totalTime = 0, totalPoints = 0, totalRating = 0, ratingCount = 0;
    games.forEach(g => {
      if (g.time !== null && g.time !== undefined && !isNaN(parseFloat(g.time))) totalTime += parseFloat(g.time);
      if (g.points !== null && g.points !== undefined && !isNaN(parseFloat(g.points))) totalPoints += parseFloat(g.points);
      let numRating = parseFloat(g.rating);
      if (!isNaN(numRating)) {
        totalRating += numRating;
        ratingCount++;
      }
    });
    return {
      count: games.length,
      totalTime: totalTime,
      totalPoints: totalPoints,
      avgRating: ratingCount > 0 ? (totalRating / ratingCount) : 0
    };
  }

  function filterTable(playerName) {
    const games = getGames(playerName);
    const searchVal = document.getElementById(`searchInput-${playerName}`).value.toLowerCase();
    const diffVal = document.getElementById(`filterDifficulty-${playerName}`).value;
    const filtered = games.filter(g => {
      const matchName = g.name.toLowerCase().includes(searchVal);
      const matchDiff = diffVal === '' || g.difficulty === diffVal;
      return matchName && matchDiff;
    });
    if (currentSort.player === playerName && currentSort.key) {
      sortGames(filtered, currentSort.key, currentSort.asc);
    }
    renderTable(playerName, filtered);
  }

  function sortTable(playerName, key) {
    const games = getGames(playerName);
    if (currentSort.player === playerName && currentSort.key === key) {
      currentSort.asc = !currentSort.asc;
    } else {
      currentSort.player = playerName;
      currentSort.key = key;
      currentSort.asc = true;
    }
    const searchVal = document.getElementById(`searchInput-${playerName}`).value.toLowerCase();
    const diffVal = document.getElementById(`filterDifficulty-${playerName}`).value;
    const filtered = games.filter(g => {
      const matchName = g.name.toLowerCase().includes(searchVal);
      const matchDiff = diffVal === '' || g.difficulty === diffVal;
      return matchName && matchDiff;
    });
    sortGames(filtered, key, currentSort.asc);
    renderTable(playerName, filtered);
  }

  function sortGames(arr, key, asc) {
    arr.sort((a, b) => {
      let valA = a[key];
      let valB = b[key];
      if (['time', 'points'].includes(key)) {
        valA = parseFloat(valA) || 0;
        valB = parseFloat(valB) || 0;
        return asc ? valA - valB : valB - valA;
      }
      valA = (valA || '').toString().toLowerCase();
      valB = (valB || '').toString().toLowerCase();
      if (valA < valB) return asc ? -1 : 1;
      if (valA > valB) return asc ? 1 : -1;
      return 0;
    });
  }

  function drawChart(playerName) {
    const canvas = document.getElementById(`chart-${playerName}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const games = getGames(playerName);
    if (!games || games.length === 0) return;

    const labels = games.map(g => g.name.length > 15 ? g.name.slice(0, 12)+'…' : g.name);
    const dataPoints = games.map(g => {
      let val = parseFloat(g.rating);
      return isNaN(val) ? 0 : val;
    });

    if (chartInstances[playerName]) chartInstances[playerName].destroy();

    const container = canvas.parentElement;
    const containerWidth = container.clientWidth || 400;
    const barWidth = 45;
    const neededWidth = games.length * barWidth + 40;
    if (neededWidth > containerWidth) canvas.style.width = neededWidth + 'px';
    else canvas.style.width = '100%';
    canvas.style.height = '250px';

    chartInstances[playerName] = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Оценка', data: dataPoints, backgroundColor: 'rgba(155,89,182,0.7)', borderColor: '#9b59b6', borderWidth: 1, borderRadius: 4, barPercentage: 0.7 }] },
      options: { responsive: false, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#666' }, grid: { color: 'rgba(255,255,255,0.04)' } }, x: { ticks: { color: '#666', maxRotation: 45 } } } }
    });
  }

    });

  function addArt(player) {
    const name = prompt('Введите название изображения:');
    if (name === null) return;
    const url = prompt('Введите URL изображения (или оставьте пустым для загрузки файла):');
    if (url !== null && url.trim() !== '') {
      const data = loadData();
      if (!data.art) data.art = {};
      if (!data.art[player]) data.art[player] = [];
      data.art[player].push({ name: name.trim() || 'Без названия', image: url.trim() });
      saveData(data);
      currentData = data;
      renderAll();
    } else {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const data = loadData();
          if (!data.art) data.art = {};
          if (!data.art[player]) data.art[player] = [];
          data.art[player].push({ name: name.trim() || 'Без названия', image: ev.target.result });
          saveData(data);
          currentData = data;
          renderAll();
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }
  }

    const data = loadData();
    if (data.art && data.art[player]) {
      data.art[player].splice(index, 1);

      currentData = data;
      renderAll();
    }
  }

    let html = `
      <div class="table-wrap"><table class="table table-bordered">
        <thead><tr><th>Игрок</th><th>Игр</th><th>Часов</th><th>Баллов</th><th>Средняя оценка</th></tr></thead>
        <tbody>`;
    players.forEach(name => {
      const stats = calcStats(name);
      html += `<tr><td>${name}</td><td>${stats.count}</td><td>${stats.totalTime.toFixed(1)}</td><td>${stats.totalPoints}</td><td>${stats.avgRating.toFixed(1)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
    html += `<div class="chart-container"><canvas id="chart-comparison"></canvas></div>`;
    container.innerHTML = html;

    const ctx = document.getElementById('chart-comparison').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: players,
        datasets: [{ label: 'Сумма баллов', data: players.map(name => calcStats(name).totalPoints), backgroundColor: 'rgba(155,89,182,0.7)', borderColor: '#9b59b6', borderWidth: 1, borderRadius: 4 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#888' } } }, scales: { y: { beginAtZero: true, ticks: { color: '#666' }, grid: { color: 'rgba(255,255,255,0.04)' } }, x: { ticks: { color: '#666' } } } }
    });
  }

  // ============================================================
  //  СМЕНА АВАТАРА
  // ============================================================
  function changeAvatar(playerName) {
    const url = prompt('Введите URL нового изображения (или оставьте пустым для загрузки файла):');
    if (url !== null && url.trim() !== '') {
      const data = loadData();
      data.players[playerName].avatar = url.trim();
      saveData(data);
      currentData = data;
      renderAll();
    } else if (url === '') {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const data = loadData();
          data.players[playerName].avatar = ev.target.result;
          saveData(data);
          currentData = data;
          renderAll();
        };
        reader.readAsDataURL(file);
      };
      input.click();
    }
  }

  // ============================================================
  //  ВСПОМОГАТЕЛЬНЫЕ
  // ============================================================
  function formatDateOrNumber(val) {
    if (!val) return '—';
    if (typeof val === 'string' && /^\d{4}-\d{2}-\d{2}/.test(val)) {
      const d = new Date(val);
      if (!isNaN(d)) return d.toLocaleDateString('ru-RU');
    }
    return val;
  }

  function openAvatarModal(playerName) {
    const avatarUrl = currentData.players[playerName]?.avatar || '';
    const content = `
      <div style="background:rgba(16,16,24,0.9); border-radius:16px; padding:20px; border:1px solid rgba(155,89,182,0.2); max-width:90vw; max-height:85vh; display:flex; align-items:center; justify-content:center;">
        <img src="${avatarUrl}" alt="${playerName}" style="max-width:100%; max-height:80vh; border-radius:12px; display:block; box-shadow:0 0 60px rgba(155,89,182,0.15);">
      </div>`;
    document.getElementById('avatarModalContent').innerHTML = content;
    new bootstrap.Modal(document.getElementById('avatarModal')).show();
  }

  function showGameDetail(playerName, index) {
    const games = getGames(playerName);
    const game = games[index];
    if (!game) return;
    document.getElementById('modalGameTitle').textContent = game.name;
    let body = `
      <p><strong>Сложность:</strong> ${game.difficulty || '—'}</p>
      <p><strong>Время (ч):</strong> ${game.time !== null ? game.time : '—'}</p>
      <p><strong>Оценка:</strong> ${game.rating || '—'}</p>
      <p><strong>HLTB:</strong> ${game.hltb || '—'}</p>
      <p><strong>Metacritic:</strong> ${formatDateOrNumber(game.metacritic)}</p>
      <p><strong>Баллы:</strong> ${game.points !== null ? game.points : '—'}</p>
      <p><strong>Комментарий:</strong> ${game.comment || '—'}</p>
      <p><strong>Применённые карточки:</strong> ${game.cards && game.cards.length ? game.cards.join(', ') : 'нет'}</p>
    `;
    document.getElementById('modalGameBody').innerHTML = body;
    new bootstrap.Modal(document.getElementById('gameDetailModal')).show();
  }

  // ============================================================
  //  ЭКСПОРТ / ИМПОРТ JSON
  // ============================================================
  function exportData() {
    const data = loadData();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'poelgovna_data.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        saveData(data);
        currentData = data;
        renderAll();
        alert('Данные импортированы успешно!');
      } catch(err) {
        alert('Ошибка импорта: ' + err.message);
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  // ============================================================
  //  РЕЖИМ РЕДАКТИРОВАНИЯ
  // ============================================================
  document.getElementById('editModeToggle').addEventListener('click', function() {
    editMode = !editMode;
    this.classList.toggle('active');
    this.textContent = editMode ? '✏️ Режим редактирования (вкл)' : '🔧 Режим редактирования';
    renderAll();
  });

  // ============================================================
  //  ЗАСТАВКА
  // ============================================================
  function hideSplash() {
    document.getElementById('splashScreen').classList.add('hidden');
    document.getElementById('mainContent').style.display = 'block';
  }

  // ============================================================
  //  ИНИЦИАЛИЗАЦИЯ
  // ============================================================
  window.addEventListener('DOMContentLoaded', function() {
    init();
  });
</script>
</body>
</html>
